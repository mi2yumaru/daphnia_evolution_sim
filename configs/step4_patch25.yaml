  - - 97
    - 97
  patch_density: 0.8
  outside_respawn_fraction: 0.05
  patch_radial_fraction: 0.25
  patch_spread_use_corners: false
  patch_spread_step: 0
  initial_food_count: 500
  food_respawn_rate: 0.02
  food_energy: 5
seasonal_food:
  enabled: true
  csv_path: data/kasumigaura_sta9_food_respawn_365_mean002.csv
behavior:
  low_energy_threshold_ratio: 0.5
  food_detection_range: 1
  site_memory_steps: 20
  current_cell_food_weight: 8.0
  nearby_food_weight: 4.0
  site_memory_weight: 2.0
organism:
  initial_population: 100
  initial_placement_mode: uniform
  paired_initialization: true
  initial_placement_near_max_distance: 3.0
  initial_placement_far_min_distance: 15.0
  initial_energy: 10
  move_cost: 0.5
  living_cost: 0.3
  reproduction_threshold: 20
  reproduction_cost: 10
  offspring_energy: 5
  randomize_initial_age: false
  randomize_lifespan: true
  lifespan_min: 150
  lifespan_max: 250
  max_age: 200
  move_type: moore
genetics:
  genome_length: 120
  mutation_rate: 0.002
gene_exchange:
  enabled: true
  mode: evolvable
  probability: 1.0
  fraction: 0.5
environment_change:
  enabled: false
  period: 200
visualization:
  enabled: true
  interval_ms: 100
  show_food: true
  show_organisms: true
  save_animation: false
  animation_path: results/simulation.gif
  save_video: false
  video_path: results/simulation.mp4
analysis:
  offspring_outcomes:
    enabled: true
    horizon_steps: 200
    save_individual: false
  gene_flow:
    enabled: true
    window_steps: 100
